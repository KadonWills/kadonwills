<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d" fill="none">
  <title id="t">Kadon Wills — Software Engineer &amp; Tech Entrepreneur</title>
  <desc id="d">Founder, Dinovix Ltd. Douala, Cameroon.</desc>

  <defs>
    <!-- dot grid -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#0B0B10" fill-opacity="0.07"/>
    </pattern>

    <!-- ambient glow behind the orbit -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2ACC" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <!-- cobalt to indigo, used on the monogram frame -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2ACC"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- travelling highlight across the wordmark -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-40" y2="0">
      <stop offset="0%" stop-color="#0B0B10"/>
      <stop offset="50%" stop-color="#2A2ACC"/>
      <stop offset="100%" stop-color="#0B0B10"/>
      <animate attributeName="x1" values="-260;980" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-40;1200" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- hairline rule fading out to the right -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A9B00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7A9B00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1000" height="280" rx="16" fill="#FAFAF7"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)"/>
  <ellipse cx="846" cy="140" rx="230" ry="180" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" stroke="#0B0B10" stroke-opacity="0.12"/>

  <!-- ── monogram ───────────────────────────────────────────── -->
  <rect x="64" y="92" width="96" height="96" rx="26" fill="#0B0B10" fill-opacity="0.02"
        stroke="url(#brand)" stroke-width="1.75"/>
  <g stroke="#0B0B10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M81 118V162"/>
    <path d="M105 118L83.5 140L105 162"/>
    <path d="M115 118V162"/>
    <path d="M115 118h13a11 11 0 0 1 0 22h-13"/>
    <path d="M115 140h15a11 11 0 0 1 0 22h-15"/>
  </g>
  <circle cx="152" cy="100" r="4" fill="#7A9B00">
    <animate attributeName="fill-opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ── wordmark ───────────────────────────────────────────── -->
  <text x="196" y="136" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="0.5" fill="url(#shine)">Kadon Wills</text>

  <text x="198" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19.5" font-weight="500" fill="#3A3A46">Software Engineer &amp; Tech Entrepreneur</text>

  <text x="199" y="200" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2.4" fill="#6A6A7A">FOUNDER, DINOVIX LTD. · DOUALA, CAMEROON · WAT</text>

  <!-- hairline + travelling dot -->
  <rect x="198" y="220" width="380" height="1.5" rx="0.75" fill="url(#rule)"/>
  <circle cy="220.75" r="3.2" fill="#7A9B00">
    <animate attributeName="cx" values="198;560;198" dur="6s" keyTimes="0;0.5;1"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;1;1;0" dur="6s" keyTimes="0;0.12;0.88;1" repeatCount="indefinite"/>
  </circle>

  <!-- ── orbit glyph ────────────────────────────────────────── -->
  <g transform="translate(846 140)" fill="none">
    <circle r="74" stroke="#0B0B10" stroke-opacity="0.18"/>
    <circle r="50" stroke="#0B0B10" stroke-opacity="0.14"/>

    <!-- outer arc, clockwise -->
    <g>
      <path d="M0 -74A74 74 0 0 1 64 -37" stroke="#2A2ACC" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 74A74 74 0 0 1 -64 37" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- inner arc, counter-clockwise -->
    <g>
      <path d="M50 0A50 50 0 0 1 -25 43" stroke="#7A9B00" stroke-width="2.5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- orbiting node -->
    <g>
      <circle cx="74" cy="0" r="5" fill="#7A9B00"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- core -->
    <circle r="9" fill="#FAFAF7" stroke="#2A2ACC" stroke-width="2"/>
    <circle r="3.4" fill="#7A9B00">
      <animate attributeName="r" values="3.4;5;3.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
